[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install && npm run build"

[deploy]
startCommand = "cd backend && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[nixpacks]
node-version = "18"

[nixpacks.setup]
nodeVersion = "18"
npmVersion = "9"

[nixpacks.install]
cmds = ["cd backend && npm install"]

[nixpacks.build]
cmds = ["cd backend && npm run build"]
dependsOn = ["install"]

[nixpacks.start]
cmd = "cd backend && node dist/index.js"
dependsOn = ["build"]

[env]
PORT = "5000"
NODE_ENV = "production"
BACKEND_URL = "https://ats-optimizer.railway.app"
FRONTEND_URL = "https://ats-optimizer.netlify.app"
